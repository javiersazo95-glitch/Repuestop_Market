    <title>RepuesTop | Marketplace de repuestos automotrices de Chile</title>
    <!-- 20-oct: la descripcion prometia "100% de garantia de compatibilidad exacta", que los Terminos niegan. -->
    <meta name="description" content="Busca repuestos para tu auto por patente o por marca, modelo y año, y compara precios de tiendas de todo Chile. Pago seguro con Flow. ¿Tienes una casa de repuestos? Vende en RepuesTop." />
    <link rel="canonical" href="https://repuestop.cl/" />
    <!-- Vista previa al compartir un enlace (WhatsApp, Facebook, LinkedIn, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepuesTop" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://repuestop.cl/" />
    <meta property="og:title" content="RepuesTop | Marketplace de repuestos automotrices de Chile" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RepuesTop: repuestos para tu auto, de tiendas de todo Chile" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 22-oct: datos estructurados para que Google muestre "RepuesTop" como nombre del sitio y
         reconozca la marca y el logo. JSON-LD no se ejecuta, asi que la CSP no lo bloquea. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "RepuesTop",
            "alternateName": ["Repuestop", "RepuesTop Chile"],
            "url": "https://repuestop.cl/"
          },
          {
            "@type": "Organization",
            "name": "RepuesTop",
            "legalName": "COREBIT SpA",
            "url": "https://repuestop.cl/",
            "logo": "https://repuestop.cl/icon-512.png",
            "email": "contacto@repuestop.cl",
            "description": "Marketplace de repuestos automotrices de Chile: busca por patente o por marca, modelo y año y compara precios de tiendas de todo el país."
          }
        ]
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
