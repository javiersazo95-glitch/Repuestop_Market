    <title>RepuesTop | Marketplace de repuestos automotrices de Chile</title>
    <!-- 20-oct: la descripcion prometia "100% de garantia de compatibilidad exacta", que los Terminos niegan. -->
    <meta name="description" content="Busca repuestos para tu auto por patente o por marca, modelo y año, y compara precios de tiendas de todo Chile. Pago seguro con Flow. ¿Tienes una casa de repuestos? Vende en RepuesTop." />
    <link rel="canonical" href="https://repuestop.cl/" />
    <!-- Vista previa al compartir un enlace (WhatsApp, Facebook, LinkedIn, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepuesTop" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://repuestop.cl/" />
    <meta property="og:title" content="RepuesTop | Marketplace de repuestos automotrices de Chile" />
    <meta property="og:description" content="Busca repuestos para tu auto por patente o por marca, modelo y año, y compara precios de tiendas de todo Chile." />
    <!-- 10-nov: logo centrado. Google recorta la miniatura a cuadrado y con la imagen anterior
         (texto a la izquierda y patente a la derecha) mostraba solo un pedazo del afiche. -->
    <meta property="og:image" content="https://repuestop.cl/og-repuestop-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de RepuesTop, marketplace de repuestos automotrices de Chile" />
    <meta name="twitter:card" content="summary_large_image" />

          },
